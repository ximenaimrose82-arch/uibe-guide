  /* ===== AI 百事通 ===== */

  .common-card h3 { color: var(--red); }
  .section-label { display: flex; align-items: baseline; gap: 8px; font-size: 13px; font-weight: 700; color: var(--text); margin: 14px 2px 8px; }
  .section-label .sl-src { font-size: 11px; font-weight: 400; color: var(--muted); }

  /* ===== v21: 通用卡片质感(鎏金描边 + 内高光 + 顶部金线) ===== */
  .check-group, .progress-wrap, .guide-card, .map-card, .contact-card, .wechat-card, .site-card, .ai-box {

  .msg.ai { background: linear-gradient(180deg, #fbf4e8, #f4eddd); border: 1px solid rgba(194,161,94,.3); }
  .msg.me { background: linear-gradient(180deg, #b62b38, var(--red-dark)); }
  .msg.thinking { animation: thinkPulse 1.2s ease-in-out infinite; }

  /* v21: 进度条金红渐变 + 打勾弹跳 */
  .progress-bar i { background: linear-gradient(90deg, var(--red), #d9a44a); }

  @media (prefers-reduced-motion: reduce) {

</style>

<script>
// ================= 版本 =================
const APP_VERSION = 'v22'; // 页面版本号: 改版后 +1, 同时更新下方数据文件的 ?v= 和 sw.js 的缓存名

// ================= 状态 =================
const store = {
  get checklist() { try { return JSON.parse(localStorage.getItem('uibe_check') || '[]'); } catch (e) { return []; } },
  set checklist(v) { localStorage.setItem('uibe_check', JSON.stringify(v)); },
};
let route = ['home'];

// 聊天记录持久化(切换页面不丢失)
const chatStore = {
  get msgs() { try { return JSON.parse(localStorage.getItem('uibe_chat') || '[]'); } catch (e) { return []; } },
  set msgs(v) { localStorage.setItem('uibe_chat', JSON.stringify(v)); },
};

// ================= 清单数据 =================
const CHECKLIST = [
  { group: "📦 材料准备", items: ["录取通知书", "准考证", "身份证原件及复印件", "一寸/二寸证件照 8 张", "学生档案（勿拆封）", "党团组织关系材料", "兵役登记证明（年满18岁男生）"] },
  { group: "💻 网上事项", items: ["完成网上预报到", "缴纳学杂费", "完成安全微课", "英语分级测试", "办理建行龙卡", "「六个一」假期任务"] },
  { group: "🏠 宿舍入住", items: ["签住宿协议", "领取钥匙和空调遥控器", "办理空调租赁", "认识室友+建宿舍群", "购买生活用品"] },
  { group: "🎓 开学注册", items: ["身份核验（宁远楼）", "学院报到（诚信楼）", "领取E卡等物资", "入学体检", "参加开学典礼"] },
];
const ALL_KEYS = CHECKLIST.flatMap(g => g.items.map(it => g.group + '|' + it));

// ================= 工具 =================
const $app = document.getElementById('app');
const $tabbar = document.getElementById('tabbar');

function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function go(h) { location.hash = h; }
function parseRoute() {
  const h = (location.hash || '#/welcome').replace(/^#/, '').split('?')[0];
  return h.split('/').filter(Boolean).map(s => { try { return decodeURIComponent(s); } catch(e) { return s; } });
}
// 搜索关键词高亮(先转义再替换, 防 XSS)
function highlight(s, kw) {
  let out = esc(s);
  if (kw) {
    const k = esc(kw).trim();
    if (k) out = out.split(k).join('<mark>' + k + '</mark>');
  }
  return out;
}
// 距报到日倒计时(按北京时间)
function daysUntil(iso) {
  const target = new Date(iso + 'T00:00:00+08:00').getTime();
  const now = Date.now();
  return Math.ceil((target - now) / 86400000);

function countdownText() {

  if (d > 0) return '⏳ 距报到还有 <b>' + d + '</b> 天';

// v21: 统计数字滚动(单 rAF 循环批量更新, 减少主线程布局; 尊重减少动态偏好)
function animateStats() {
  const els = [...document.querySelectorAll('.hstat b[data-count]')];
  if (!els.length) return;
  const reduced = !window.matchMedia || window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduced) { els.forEach(e => { e.textContent = e.dataset.count; }); return; }
  const dur = 600, t0 = performance.now();
  (function tick(t) {
    const p = Math.min(1, (t - t0) / dur);
    const ease = 1 - Math.pow(1 - p, 3);
    for (const el of els) el.textContent = Math.round(parseInt(el.dataset.count, 10) * ease);
    if (p < 1) requestAnimationFrame(tick);
  })(t0);
}
// 复制 + Toast 提示
function copyText(text) {
  const ok = () => toast('已复制到剪贴板');
  const fail = () => { fallbackCopy(text); };
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(ok, fail);
  else fail();
}
function fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); toast('已复制到剪贴板'); } catch (e) { toast('复制失败，请长按手动复制'); }
  document.body.removeChild(ta);
}
function copyMsg(btn) { copyText(btn.dataset.text || ''); }
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove('show'), 1600);
}

}

// ================= 地图 Lightbox (缩放: 按钮 / 双击 / 拖动) =================
// 实现方式: 修改 <img> 宽度实现缩放(1x=原图宽), 外层滚动容器天然支持拖动;
// 缩放时按当前视野中心为锚点, 避免放大后视角跳走
let lbScale = 1;     // 当前倍率 1~4
let lbBaseW = 0;     // 原图宽度(px), 首次打开时读取
let lbTapT = 0, lbTapX = 0, lbTapY = 0; // 双击检测

function lbImg() { const lb = document.getElementById('lightbox'); return lb ? lb.querySelector('img') : null; }
function lbBody() { const lb = document.getElementById('lightbox'); return lb ? lb.querySelector('.lightbox-body') : null; }

function lbApply(scale, anchor) {
  const img = lbImg(), body = lbBody();
  if (!img || !body) return;
  lbScale = Math.min(4, Math.max(1, scale));
  // 锚点: 默认视野中心; 传入 clientX/clientY(双击位置) 时保持该屏幕点不动
  const rect = body.getBoundingClientRect();
  const ax = (anchor ? anchor.x : rect.width / 2) - rect.left;
  const ay = (anchor ? anchor.y : rect.height / 2) - rect.top;
  // 记录锚点在图片上的比例位置, 改宽后按同比例恢复
  const fx = (body.scrollLeft + ax) / (img.clientWidth || 1);
  const fy = (body.scrollTop + ay) / (img.clientHeight || 1);
  img.style.width = Math.round(lbBaseW * lbScale) + 'px';
  body.scrollLeft = fx * img.clientWidth - ax;
  body.scrollTop = fy * img.clientHeight - ay;
  const label = document.getElementById('lbZoomLabel');
  if (label) label.textContent = Math.round(lbScale * 100) + '%';
}

// 按钮缩放: dir=1 放大 / -1 缩小 / 0 重置
function lbZoom(dir) {
  const steps = [1, 1.5, 2, 2.5, 3, 4];
  let target;
  if (dir === 0) target = 1;
  else if (dir > 0) target = steps.find(s => s > lbScale + 0.01) || 4;
  else target = [...steps].reverse().find(s => s < lbScale - 0.01) || 1;
  lbApply(target);
}

// 双击: 在 1x 与 2x 之间切换, 以点击位置为锚点(300ms 内、位移 <30px 判定为双击)
function lbOnTap(e) {
  const now = Date.now();
  const dx = e.clientX - lbTapX, dy = e.clientY - lbTapY;
  if (now - lbTapT < 300 && dx * dx + dy * dy < 900) {
    lbApply(lbScale > 1.01 ? 1 : 2, { x: e.clientX, y: e.clientY });
    lbTapT = 0;
  } else {
    lbTapT = now; lbTapX = e.clientX; lbTapY = e.clientY;
  }
}

function openLightbox() {
  const lb = document.getElementById('lightbox');
  if (!lb) return;
  lb.classList.add('open');
  document.body.style.overflow = 'hidden';
  const img = lb.querySelector('img');
  if (img && !img.src) {
    // 延迟加载: 首次打开大图时才设置 src (data-src 占位, 避免首访下载 329KB)
    img.src = img.dataset.src || 'assets/uibe-campus-map.jpg';
    img.addEventListener('load', () => {
      lbBaseW = img.naturalWidth || 1600;
      lbApply(lbScale); // 图片就绪后按当前倍率重排(首次打开倍率=1, 无视觉跳变)
    }, { once: true });
  }
  if (!lbBaseW) lbBaseW = (img && img.naturalWidth) || 1600;
  lbApply(1); // 每次打开重置缩放
  // 初始水平居中显示(地图中部的教学区), 用户可拖动/缩放查看
  const body = lb.querySelector('.lightbox-body');
  requestAnimationFrame(() => {
    if (body) body.scrollLeft = (body.scrollWidth - body.clientWidth) / 2;
  });
  const close = lb.querySelector('.lightbox-close');
  if (close) close.focus();
}

function closeLightbox() {
  const lb = document.getElementById('lightbox');
  if (!lb) return;
  lb.classList.remove('open');
  document.body.style.overflow = '';
}

function toggleCheck(i) {
  const key = ALL_KEYS[i];
  const done = store.checklist;
  const idx = done.indexOf(key);
  if (idx >= 0) done.splice(idx, 1); else done.push(key);
  store.checklist = done;

  // 增量更新 DOM, 不再整页重绘(保留滚动位置)
  const item = document.querySelector('.check-item[data-i="' + i + '"]');
  if (item) {
    const nowDone = done.includes(key);
    item.classList.toggle('done', nowDone);
    item.querySelector('.check-box').textContent = nowDone ? '✓' : '';
  }
  const pct = Math.round(done.length / ALL_KEYS.length * 100);
  const sub = document.getElementById('checkSub');
  const pctEl = document.getElementById('progPct');
  const bar = document.getElementById('progBar');
  const doneEl = document.getElementById('progDone');
  if (sub) sub.textContent = `完成 ${done.length}/${ALL_KEYS.length}`;
  if (pctEl) pctEl.textContent = pct + '%';
  if (bar) bar.style.width = pct + '%';
  if (doneEl) doneEl.classList.toggle('show', pct === 100);
}

// ================= AI 百事通 =================
let lastAIQuestion = '';
let sugList = [];

function pickSugs(n = 8) {
  const idxs = [...FAQ.keys()];
  for (let i = idxs.length - 1; i > 0; i--) { // Fisher-Yates 洗牌
    const j = Math.floor(Math.random() * (i + 1));
    [idxs[i], idxs[j]] = [idxs[j], idxs[i]];
  }
  sugList = idxs.slice(0, n);
  const el = document.getElementById('aiSug');
  if (!el) return;
  el.innerHTML = sugList.map(i => `<button type="button" class="sug-chip" onclick="askByIndex(${i})">${esc(FAQ[i].q)}</button>`).join('') +
    `<button type="button" class="sug-chip more" onclick="pickSugs()">🔄 换一批</button>`;
}

// ================= 交互 =================
function askByIndex(i) { askText(FAQ[i].q, FAQ[i].a); }

function ask() {
  const input = document.getElementById('aiInput');
  const text = input.value.trim();
  if (!text) return;
  const found = matchFaq(text);
  if (found) {
    askText(text, found.a);
  } else {
    const guide = matchGuide(text);   // 第二层: 本地攻略库兜底(不依赖网络)
    if (guide) {
      askText(text, '📚 从攻略里找到相关答案：\n\n《' + guide.title + '》\n' + guide.body + '\n\n（更多细节可在「攻略库」分类里查看）');
    } else {
      askAI(text);                     // 第三层: 走 DeepSeek AI
    }
  }
  input.value = '';
}

// 攻略库模糊搜索兜底: 严格匹配(标题优先), 拿不准就不答, 避免乱答
function matchGuide(text) {
  // 去掉常见疑问词, 提取问题核心(整体删除, 避免残留空格切断子串)
  const qwords = text.replace(/[？?。，,!！在哪里怎么什么是吗有没有哪些哪个哪家多少如何啥为什么可不可以能否]/g, '').replace(/\s+/g, '');
  if (qwords.length < 3) return null;
  const subs = new Set();
  for (let len = 4; len >= 3; len--) {   // 只用 3-4 字子串, 减少 2 字噪音
    for (let i = 0; i + len <= qwords.length; i++) subs.add(qwords.slice(i, i + len));
  }
  let best = null, bestScore = 0;
  for (const g of GUIDES) {
    let score = 0;
    for (const s of subs) {
      if (g.title.includes(s)) score += s.length * 4;  // 标题命中权重高
      if (g.body.includes(s)) score += s.length;
    }
    if (score > bestScore) { bestScore = score; best = g; }
  }
  return bestScore >= 10 ? best : null;  // 高阈值: 匹配不扎实就不答
}

// ===== AI 代理: 双通道自动切换 =====
// ① 腾讯云函数(国内, 手机秒连) ② Cloudflare Worker(备用)
const AI_PROXY_URLS = [
  'https://1476579079-52r3nccknz.ap-guangzhou.tencentscf.com',  // 腾讯云 SCF(国内直连)
  'https://uibe-ai-proxy.ximenaimrose82.workers.dev',  // Cloudflare Worker(备用)
];

async function askAI(text, showUser = true) {
  lastAIQuestion = text;
  const box = document.getElementById('aiMsgs');
  const sendBtn = document.getElementById('aiSend');
  if (showUser) box.insertAdjacentHTML('beforeend', `<div class="msg me">${esc(text)}</div>`);
  box.insertAdjacentHTML('beforeend', '<div class="msg ai thinking">🤔 AI 思考中…</div>');
  box.scrollTop = box.scrollHeight;
  if (sendBtn) { sendBtn.disabled = true; sendBtn.textContent = '…'; }
  let d = null;
  // 依次尝试各通道, 第一个能用的就用它
  for (const url of AI_PROXY_URLS) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 8000); // 每通道8秒超时
    try {
      const r = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question: text }),
        signal: controller.signal,
      });
      d = await r.json();
    } catch (e) { d = null; }
    finally { clearTimeout(timer); }
    if (d && d.answer) break;              // 拿到答案, 停止尝试
    if (d && d.error && (d.error.includes('上限') || d.error.includes('频繁'))) break; // 熔断/限流, 不降级
  }
  const thinking = box.querySelector('.thinking');
  if (thinking) thinking.remove();
  if (sendBtn) { sendBtn.disabled = false; sendBtn.textContent = '发送'; }
  if (d && d.answer) {
    pushMsgs(showUser ? [{ role: 'me', text: text }, { role: 'ai', text: d.answer }] : [{ role: 'ai', text: d.answer }]);
    box.insertAdjacentHTML('beforeend', msgHTML('ai', d.answer));
  } else if (d && d.error) {
    box.insertAdjacentHTML('beforeend', msgHTML('ai', d.error)); // 显示服务器业务错误(如限流提示)
  } else {
    box.insertAdjacentHTML('beforeend', msgHTML('ai',
      `AI 服务暂时连不上（手机网络限制）。\n\n你可以：\n① 直接问我常见问题（报到、军训、选课、食堂…）\n② 去「📚 攻略库」翻 ${GUIDES.length} 篇攻略\n③ 换个 Wi-Fi 再试 AI`) +
      '<div><button type="button" class="retry-btn" onclick="retryAI()">🔄 重试</button></div>');
  }
  box.scrollTop = box.scrollHeight;
}

function retryAI() {
  if (lastAIQuestion) askAI(lastAIQuestion, false);
}

// 评分式关键词匹配：按命中关键词总长度打分，短问题额外加分
function matchFaq(text) {
  let best = null, bestScore = 0;
  for (const f of FAQ) {
    let score = 0;
    for (const k of f.kws) {
      if (text.includes(k)) score += k.length * 2;
    }
    if (score === 0) continue; // 无任何关键词命中 → 直接跳过
    if (text.length <= 8) score += 1; // 短问题(可能是泛问)略加分,提高命中率
    if (score > bestScore) { bestScore = score; best = f; }
  }
  return best;
}

function askText(q, a) {
  const box = document.getElementById('aiMsgs');
  const msgs = [];
  if (q) {
    box.insertAdjacentHTML('beforeend', msgHTML('me', q));
    msgs.push({ role: 'me', text: q });
  }
  box.insertAdjacentHTML('beforeend', msgHTML('ai', a));
  msgs.push({ role: 'ai', text: a });
  pushMsgs(msgs);
  box.scrollTop = box.scrollHeight;
}

}
